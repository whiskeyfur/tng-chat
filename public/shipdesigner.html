<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ship designer</title>
  <link rel="stylesheet" href="/vendor/litegraph.css">
  <style>
    :root { color-scheme: dark; --bg: #16181d; --panel: #1f2229; --line: #343844; --text: #e6e6e6; --dim: #9aa0ab; --accent: #58a6ff; --bad: #f85149; --good: #3fb950; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 14px; margin: 0 8px 0 0; }
    header a { color: var(--dim); margin-right: 6px; }
    header .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
    header .status { margin-left: auto; color: var(--dim); }
    header .status.dirty { color: #d29922; }
    button, select, input, textarea { font: inherit; color: var(--text); background: #2a2e37; border: 1px solid var(--line); border-radius: 4px; }
    button { padding: 3px 9px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: #1f6feb; border-color: #1f6feb; }
    button.danger { color: var(--bad); }
    select, input { padding: 2px 4px; }
    main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
    #canvas-wrap { position: relative; min-width: 0; min-height: 0; }
    #graph-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #legend { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 8px; background: rgba(22, 24, 29, .85); border-radius: 4px; pointer-events: none; font-size: 12px; }
    #legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
    aside { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px 40px; }
    aside h2 { font-size: 14px; margin: 0 0 8px; }
    aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 14px 0 4px; }
    aside p.hint { color: var(--dim); margin: 4px 0; font-size: 12px; }
    .row { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
    .row > label { color: var(--dim); }
    .row input, .row select, .row textarea { width: 100%; }
    textarea { width: 100%; min-height: 70px; padding: 4px; font-family: ui-monospace, monospace; font-size: 12px; }
    textarea.bad, input.bad { border-color: var(--bad); }
    table.res { width: 100%; border-collapse: collapse; }
    table.res td { padding: 2px; }
    table.res input { width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    footer { max-height: 30vh; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 10px; font-size: 12px; }
    footer:empty { display: none; }
    footer .ok { color: var(--good); }
    footer .bad { color: var(--bad); }
    footer .warn { color: #d29922; margin-top: 4px; }
    footer li { cursor: pointer; }
    footer li:hover { text-decoration: underline; }
    footer ul { margin: 2px 0; padding-left: 18px; }
    fieldset.res-block { border: 1px solid; border-radius: 4px; margin: 8px 0; padding: 4px 8px; }
    fieldset.res-block legend { padding: 0 4px; }
    ul.wires { margin: 2px 0; padding-left: 18px; }
    ul.wires a { color: var(--accent); }
    .about { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  </style>
</head>
<body>
  <header>
    <a href="/admin">Admin</a>
    <h1>Ship designer</h1>
    <select id="design" title="Design file (config/ships)"></select>
    <button id="new">New</button>
    <span class="sep"></span>
    <button id="check">Check</button>
    <button id="save" class="primary">Save</button>
    <button id="save-as">Save as…</button>
    <span class="sep"></span>
    <button id="arrange" title="Lay the nodes out again, by what feeds what">Auto-arrange</button>
    <button id="regroup" title="Redraw the boxes round each system and its parts">Regroup</button>
    <button id="fit">Fit</button>
    <label title="Wire colour">Wires <select id="wire-mode"><option value="state">by state</option><option value="resource">by resource</option></select></label>
    <label title="Hide the heat wires (every system to the coolant loop)"><input type="checkbox" id="hide-heat"> hide heat</label>
    <span class="status" id="status"></span>
  </header>
  <main>
    <div id="canvas-wrap">
      <canvas id="graph-canvas" tabindex="0"></canvas>
      <div id="legend"></div>
    </div>
    <aside id="panel"></aside>
  </main>
  <footer id="problems"></footer>
  <script src="/vendor/litegraph.js"></script>
  <script src="shipdesigner.js"></script>
</body>
</html>
