<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCARS: Report aboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='5' fill='%23ff9900'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap">
  <link rel="stylesheet" href="lcars.css">
  <link rel="stylesheet" href="console.css">
  <style>
    #register-form { flex-direction: row; justify-content: flex-start; }
    #register-screen { justify-content: flex-start; }

    /* Station displays (stations.js) */
    .st-canvas-wrap { position: relative; flex: 1 1 120px; min-height: 60px; border-radius: 12px; background: #050505; overflow: hidden; }
    .st-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .st-ship { display: block; flex: 1 1 0; min-height: 0; width: 100%; height: 100%; }
    .st-core { animation: st-pulse 1.6s ease-in-out infinite; }
    .st-nacelle { animation: st-pulse 2.4s ease-in-out infinite; }
    @keyframes st-pulse { 50% { opacity: 0.35; } }
    .st-shields { display: block; flex: 1 1 0; min-height: 120px; width: 100%; margin: 0 auto; }
    .st-decks { display: grid; grid-template-columns: 34px repeat(var(--cols, 8), minmax(0, 1fr)); gap: 4px; align-items: center; }
    .st-deck-label { color: var(--lcars-tan); font-size: 13px; }
    .st-cell { height: 16px; border-radius: 4px; background: var(--lcars-blue); opacity: 0.55; transition: background 0.4s; }
    .st-cell[data-state='warn'] { background: var(--lcars-gold); opacity: 1; }
    .st-cell[data-state='alert'] { background: var(--lcars-red); opacity: 1; animation: lcars-blink 0.6s steps(2) 4; }
    .st-shields[data-down] path[data-arc] { opacity: 0.08 !important; }
    .st-pad { display: block; flex: 1 1 0; min-height: 120px; width: 100%; }
    .st-pad.st-energize .st-beam { animation: st-shimmer 2.4s ease-in-out; }
    @keyframes st-shimmer { 0%, 100% { opacity: 0; } 30%, 70% { opacity: 0.9; } 50% { opacity: 0.4; } }
    .st-control { display: flex; flex-direction: column; gap: 10px; }
    .st-control .st-state { margin: 0; font-size: 26px; text-transform: uppercase; }
    .st-control .st-state[data-up] { color: var(--lcars-red); }
    .st-control .st-state:not([data-up]) { color: var(--lcars-sky); }
    .relay-form { margin-top: 6px; }
    .relay-form .ops-input { min-width: 260px; flex: 1 1 260px; font-size: 15px; }
    .st-roster, .st-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 24px; text-transform: uppercase; }
    .st-roster li, .st-list li { display: flex; justify-content: space-between; gap: 12px; color: var(--lcars-gold); font-size: 20px; border-bottom: 2px dotted #333; }
    .st-roster li span, .st-list li span { color: var(--accent); font-size: 16px; }
  </style>
</head>
<body>
  <div class="lcars-app">
    <header class="lcars-header">
      <div class="lcars-elbow lcars-elbow--top"><span id="station-code">LCARS</span></div>
      <div class="lcars-bar">
        <span class="lcars-bar__seg lcars-bar__seg--a"></span>
        <span class="lcars-header__console" id="station-sub">Personnel access</span>
        <span class="lcars-bar__seg lcars-bar__seg--b"></span>
        <h1 class="lcars-header__title" id="station-title">Report aboard</h1>
      </div>
    </header>

    <nav class="lcars-sidebar" aria-label="Console">
      <button type="button" class="lcars-nav-button comms-button" id="comms-button" style="--accent: var(--lcars-orange)" hidden><span>Comms</span></button>
      <div id="sections" style="display: contents"></div>
      <button type="button" class="lcars-nav-button" data-screen-tab="log" id="log-tab" style="--accent: var(--lcars-lilac)" hidden><span>Console log</span></button>
      <button type="button" class="lcars-nav-button" data-screen-tab="reassign" id="reassign-tab" style="--accent: var(--lcars-tan)" hidden><span>Station</span></button>
      <div class="lcars-sidebar__fill"></div>
      <button type="button" class="lcars-nav-button" data-screen-tab="library" id="library-tab" style="--accent: var(--lcars-violet)" hidden><span>Library</span></button>
    </nav>

    <main class="lcars-content" tabindex="-1">
      <div class="screen" id="register-screen" data-screen="register">
      <section class="lcars-panel lcars-panel--auto" id="register" style="--accent: var(--lcars-orange)">
        <h2 class="lcars-panel__title"><span>Personnel identification</span></h2>
        <div class="lcars-panel__body">
          <form class="ops-form" id="register-form">
            <input class="ops-input" id="name" placeholder="Your name" autocomplete="off" required>
            <select class="ops-select" id="ship" aria-label="ship" required></select>
            <select class="ops-select" id="station" aria-label="station" required></select>
            <button class="lcars-button lcars-button--pill">Report aboard</button>
          </form>
          <p class="lcars-note" id="register-error"></p>
          <form class="ops-form relay-form" id="relay-form">
            <span>Comm relay</span>
            <input class="ops-input" id="relay" placeholder="wss://relay.example.com" autocomplete="off" aria-label="comm relay address">
            <button class="lcars-button lcars-button--pill">Connect</button>
          </form>
        </div>
      </section>
      </div>

      <div id="home" hidden style="display: contents">
        <div id="station-view" style="display: contents"></div>
        <div class="screen" data-screen="library" id="library-view" hidden></div>
      </div>

      <div class="screen" data-screen="reassign" hidden>
        <section class="lcars-panel lcars-panel--auto" style="--accent: var(--lcars-tan)">
          <h2 class="lcars-panel__title"><span>Duty assignment</span></h2>
          <div class="lcars-panel__body">
            <p class="ops-network" id="assignment"></p>
            <form class="ops-form" id="reassign-form">
              <span>Report to</span>
              <select class="ops-select" id="new-station" aria-label="new station"></select>
              <button class="lcars-button lcars-button--pill">Change station</button>
            </form>
            <p class="ops-hint">Moves you to another station aboard this ship. Calls in progress carry on. To change ships, ask the transporter room.</p>
          </div>
        </section>
      </div>

      <div class="screen" data-screen="log" hidden>
        <section class="lcars-panel" id="log-panel" style="--accent: var(--lcars-lilac)">
          <h2 class="lcars-panel__title"><span>Console log</span></h2>
          <div class="lcars-panel__body"><ol class="lcars-log" id="log"></ol></div>
        </section>
      </div>
    </main>

    <footer class="lcars-footer">
      <div class="lcars-elbow lcars-elbow--bottom"></div>
      <div class="lcars-bar">
        <span class="lcars-status" id="link" data-status="connecting">Comm relay</span>
        <span class="lcars-bar__seg lcars-bar__seg--c"></span>
        <span class="lcars-footer__stardate" id="stardate"></span>
      </div>
    </footer>
  </div>
  <script src="config.js"></script>
  <script src="relay.js"></script>
  <script src="screens.js"></script>
  <script src="library.js"></script>
  <script src="voice.js"></script>
  <script src="comms.js"></script>
  <script src="stations.js"></script>
  <script src="client.js"></script>
</body>
</html>
